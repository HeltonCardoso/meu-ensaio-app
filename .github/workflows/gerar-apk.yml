name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Conferir o kit do Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || echo "::error::Kit do Android não encontrado no servidor"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Mostrar erro da compilação
        if: failure()
        run: |
          if [ -f build.log ]; then
            grep -n -A25 -E "What went wrong|error:|FAILURE|Exception" build.log | head -80 > erro.txt || tail -60 build.log > erro.txt
            [ -s erro.txt ] || tail -60 build.log > erro.txt
            while IFS= read -r line; do echo "::error::${line}"; done < erro.txt
          fi

      - name: Renomear
        run: cp app/build/outputs/apk/release/app-release.apk MeuEnsaio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MeuEnsaio-apk
          path: MeuEnsaio.apk

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Meu Ensaio 1.${{ github.run_number }}
          body: Baixe o MeuEnsaio.apk abaixo e instale no celular.
          files: MeuEnsaio.apk
          make_latest: true
