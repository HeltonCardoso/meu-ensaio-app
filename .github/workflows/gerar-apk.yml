name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Renomear
        run: cp app/build/outputs/apk/release/app-release.apk MeuEnsaio.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MeuEnsaio-apk
          path: MeuEnsaio.apk

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Meu Ensaio 1.${{ github.run_number }}
          body: Baixe o MeuEnsaio.apk abaixo e instale no celular.
          files: MeuEnsaio.apk
          make_latest: true
